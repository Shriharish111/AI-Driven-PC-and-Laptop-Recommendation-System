<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PC Recommendation System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #111118;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-weight: bold;
            color: #00f5ff;
            text-shadow: 0 0 8px #00f5ff;
            font-size: 18px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-section img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #00f5ff;
        }

        .logout-btn {
            color: #ff0080;
            text-decoration: none;
            font-size: 14px;
        }

        .logout-btn:hover {
            text-shadow: 0 0 6px #ff0080;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        ⚡ PC Recommendation System
    </div>

    <!-- Language Switch -->
    <div class="language-switch">
        <a href="/set-language/en" class="lang-btn {% if session.get('lang','en')=='en' %}active{% endif %}">EN</a>
        <a href="/set-language/ta" class="lang-btn {% if session.get('lang')=='ta' %}active{% endif %}">தமிழ்</a>
        <a href="/set-language/hi" class="lang-btn {% if session.get('lang')=='hi' %}active{% endif %}">हिंदी</a>
        <div class="slider"></div>
    </div>

    {% if session.get("user") %}
    <div class="user-section">
        <img src="{{ session['user']['picture'] }}">
        <span>{{ session['user']['name'] }}</span>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>
    {% endif %}

</div>

<!-- Page Content -->
{% block content %}{% endblock %}

</body>
</html>
