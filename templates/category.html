{% extends "base.html" %}

{% block content %}

<div class="page-container">
    <div class="glass-box">

        <h2 class="hero-title" style="font-size:28px;">
            {{ t("Select Category") }}
        </h2>

        <div class="option-button" onclick="submitCategory('pc')">
            {{ t("Desktop PC") }}
        </div>

        <div class="option-button" onclick="submitCategory('laptop')">
            {{ t("Laptop") }}
        </div>

        <form id="categoryForm" method="POST" action="/budget">
            <input type="hidden" name="category" id="categoryInput">
        </form>

    </div>
</div>

<script>
function submitCategory(value) {
    document.getElementById("categoryInput").value = value;
    document.getElementById("categoryForm").submit();
}
</script>

{% endblock %}
